name: Integração contínua

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  formatacao:
    name: Formatação
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verificar clang-format
        run: clang-format --dry-run --Werror src/*.c src/*.h src/interno/*.inc

  linux:
    name: Linux — áudio ${{ matrix.audio }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        audio: ["ON", "OFF"]
    steps:
      - uses: actions/checkout@v4
      - name: Instalar dependências
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libasound2-dev
      - name: Configurar
        run: >-
          cmake -S . -B build/ci
          -DCMAKE_BUILD_TYPE=Release
          -DMYTHARA_AUDIO=${{ matrix.audio }}
          -DMYTHARA_AVISOS_COMO_ERROS=ON
      - name: Compilar
        run: cmake --build build/ci --parallel
      - name: Testar
        run: ctest --test-dir build/ci --output-on-failure

  sanitizadores:
    name: ASan e UBSan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar dependências
        run: sudo apt-get update && sudo apt-get install -y libx11-dev clang
      - name: Compilar
        run: >-
          clang -std=c11 -O1 -g -Wall -Wextra -Wpedantic -Werror
          -DMYTHARA_SEM_AUDIO -fsanitize=address,undefined
          src/mythara.c src/formato_binario.c src/idioma.c
          -o mythara-sanitizado -lX11 -lm -pthread
      - name: Testar
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1
        run: ./mythara-sanitizado --autoteste

  windows:
    name: Windows nativo — MSVC
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configurar
        run: >-
          cmake -S . -B build/ci
          -DMYTHARA_AUDIO=ON
          -DMYTHARA_AVISOS_COMO_ERROS=ON
      - name: Compilar
        run: cmake --build build/ci --config Release --parallel
      - name: Testar
        run: ctest --test-dir build/ci -C Release --output-on-failure
      - name: Publicar binário de verificação
        uses: actions/upload-artifact@v4
        with:
          name: mythara-windows
          path: build/ci/Release/mythara.exe
          if-no-files-found: error
